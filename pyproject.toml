[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ears-acoustic"
version = "0.2.0"
description = "Evidence-preserving acoustic interface experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ears = "ears.cli:main"

[tool.setuptools.packages.find]
where = ["src"]